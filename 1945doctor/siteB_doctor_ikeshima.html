<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 標題會顯示當前人物名稱 -->
    <title>池島醫生</title>
    <style>
        /* 基礎佈局與樣式 (使用 Tailwind 風格優化可讀性) */
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            display: flex; 
            justify-content: center; /* 居中佈局 */
            align-items: flex-start; 
            min-height: 100vh;
            background-color: transparent;
            padding: 20px;
        }
        #chat-container { 
            width: 100%;
            max-width: 800px; /* 限制最大寬度 */
            padding: 30px; 
            background-color: #ffffff; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-radius: 16px;
        }
        #chat-window { 
            height: 400px; /* 增加高度 */
            border: 1px solid #e0e0e0; 
            overflow-y: scroll; 
            padding: 15px; 
            margin-bottom: 20px; 
            background-color: #fcfcff; /* 輕微的背景色 */
            border-radius: 10px;
        }
        h2 {
            color: #1a56db; /* 主題色 */
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            margin-top: 0;
            font-weight: 600;
        }
        .message { 
            margin-bottom: 15px; 
            padding: 12px 18px; 
            border-radius: 20px;
            max-width: 80%;
            line-height: 1.6;
        }
        .user { 
            text-align: right; 
            background-color: #e3f2fd; /* 淺藍色 */
            color: #0d47a1; 
            margin-left: auto;
            border-bottom-right-radius: 4px; /* 讓角落更有變化 */
        }
        .assistant { 
            text-align: left; 
            background-color: #f1f8e9; /* 淺綠色 */
            color: #33691e; 
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        textarea { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            resize: none; /* 禁止垂直縮放 */
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 1em;
        }
        button { 
            padding: 10px 20px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: 500;
            margin-right: 15px;
            transition: background-color 0.3s, opacity 0.3s;
        }
        .chat-btn-group button:first-child { 
            background-color: #1a56db; /* 藍色 */
        }
        .chat-btn-group button:first-child:hover:not(:disabled) { 
            background-color: #1545b8; 
        }
        .chat-btn-group button:last-child { 
            background-color: #f97316; /* 橘色 */
        }
        .chat-btn-group button:last-child:hover:not(:disabled) { 
            background-color: #e56000; 
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #reset-status {
            font-size: 0.9em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 聊天容器 -->
    <div id="chat-container">
        <!-- AI 人物的名稱會顯示在標題中 -->
        <h2 id="chat-title">💬 與 池島醫生 對話</h2>
        
        <!-- 對話視窗 -->
        <div id="chat-window"></div>
        
        <!-- 使用者輸入框 -->
        <textarea id="user-input" rows="4" placeholder="在此輸入您的問題... (按下 Enter 發送)" 
            onkeydown="if(event.key === 'Enter' && !event.shiftKey) { sendMessage(); event.preventDefault(); }"></textarea>
        
        <!-- 按鈕組 -->
        <div class="chat-btn-group">
            <button onclick="sendMessage()">發送訊息</button>
            <button onclick="resetChat()">重置對話</button>
        </div>
        
        <!-- 狀態訊息 -->
        <p id="reset-status"></p>
    </div>

    <script>
        // 🚨 這是唯一的配置點：請修改這裡的 AI_PERSONA_ID
        const AI_PERSONA_ID = "doctor_ikeshima"; 

        // 🚨 這是您的 Worker 基礎 URL，請確認其正確性。
        const WORKER_URL = "https://history-agent.idcllab702.workers.dev";

        let conversationHistory = []; // 用於儲存對話歷史

        // *** 核心修正點 1: 新增人物 ID 與顯示名稱的對照表 ***
        const personaNames = {
            'doctor_ikeshima': '池島醫生',
			'doctor_lin': '林鵬飛醫生',
            'doctor_hsu': '許讀醫生',
            'doctor_wu': '吳平城醫生',
            // 如果您有更多人物，請在此處擴充
        };

        // --- 輔助函數 ---

        /** 獲取聊天 API URL */
        function getChatEndpoint(personaId) {
            return `${WORKER_URL}/api/chat/${personaId}`;
        }

        /** 顯示訊息到聊天窗口 */
        function displayMessage(role, content) {
            const chatWindow = document.getElementById('chat-window');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            // *** 核心修正點 2: 根據角色使用正確的名稱 ***
            let speakerName;
            if (role === 'user') {
                speakerName = '您';
            } else {
                // AI (assistant) 使用對照表中的中文名稱，如果找不到則使用 ID (作為備用)
                speakerName = personaNames[AI_PERSONA_ID] || AI_PERSONA_ID; 
            }
            // *** 修正點結束 ***
            
            msgDiv.innerHTML = `<strong>${speakerName}：</strong> ${content.replace(/\n/g, '<br>')}`;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight; // 滾動到底部
        }

        /** 發送訊息並呼叫 Worker API */
        async function sendMessage() {
            const userInput = document.getElementById('user-input');
            const userContent = userInput.value.trim();
            if (!userContent) return;

            const chatEndpoint = getChatEndpoint(AI_PERSONA_ID);
            
            // 禁用輸入，防止重複發送
            userInput.disabled = true;
            document.querySelector('.chat-btn-group button:first-child').disabled = true;

            displayMessage('user', userContent);
            conversationHistory.push({ role: "user", content: userContent });
            userInput.value = '';

            const payload = { messages: conversationHistory };

            try {
                const response = await fetch(chatEndpoint, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    const assistantResponse = data.response;
                    displayMessage('assistant', assistantResponse);
                    conversationHistory.push({ role: "assistant", content: assistantResponse });
                } else {
                    displayMessage('assistant', `[Worker 錯誤 (${response.status}): ${data.error || data.details || '未知錯誤'}]`);
                }

            } catch (error) {
                console.error("Fetch 錯誤:", error);
                displayMessage('assistant', 
                    `[網路錯誤：無法連線。請確認 Worker URL: ${chatEndpoint} 正確且 Worker 已部署。]`);
            } finally {
                // 重新啟用輸入
                userInput.disabled = false;
                document.querySelector('.chat-btn-group button:first-child').disabled = false;
                userInput.focus(); // 讓游標回到輸入框
            }
        }

        /** 清除對話歷史 */
        function resetChat() {
            conversationHistory = [];
            document.getElementById('chat-window').innerHTML = '';
            
            const resetStatus = document.getElementById('reset-status');
            resetStatus.style.color = 'green';
            resetStatus.textContent = "✅ 對話歷史已重置！您可以開始新對話。";
            
            setTimeout(() => { resetStatus.textContent = ''; }, 3000);
        }

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
             // 確保聊天標題與配置的人物一致
             const displayName = personaNames[AI_PERSONA_ID] || AI_PERSONA_ID;
             document.getElementById('chat-title').textContent = `💬 與 ${displayName} 對話`;
        });
    </script>
</body>

</html>
