<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 模型參考列表</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 設定 Tailwind 樣式，使用 Inter 字體 -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 20px;
            background-color: #f7f7f7;
        }
        /* 基礎表格樣式，移除邊界與色彩 */
        .simple-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .simple-table th, .simple-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e5e5; /* 只有細細的底線 */
        }
        .simple-table th {
            font-weight: 600;
            background-color: #f0f0f0; /* 輕微的背景色以區分表頭 */
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">封測 AI 模型參考列表 (角色扮演/指令遵循優化)</h2>
        
        <table class="simple-table">
            <thead>
                <tr>
                    <th class="text-gray-600">作者 (Author)</th>
                    <th class="text-gray-600">Cloudflare 提供的 AI 模型 (Model)</th>
                    <th class="text-gray-600">備註 (Notes)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Mistral AI</td>
                    <td class="font-mono text-sm">@cf/mistralai/mistral-small-3.1-24b-instruct</td>
                    <td>高性能，對話與指令遵循能力強。</td>
                </tr>
                <tr>
                    <td>Meta</td>
                    <td class="font-mono text-sm">@cf/meta/llama-3.3-70b-instruct-fp8-fast</td>
                    <td> </td>
                </tr>
            </tbody>
        </table>

        <p class="mt-4 text-xs text-gray-500">提示：請在 Workers 設定中選擇一個模型作為預設值。</p>
    </div>

</body>
</html>
