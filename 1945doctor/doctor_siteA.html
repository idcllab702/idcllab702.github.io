<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A 網站 - AI 人物封測與調校工具</title>
    <style>
        /* 基礎佈局與樣式 (使用 Tailwind 風格優化可讀性) */
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            display: flex; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #f0f2f5; 
        }
        #prompt-panel { 
            width: 35%; /* 稍微加寬以容納更多控制項 */
            padding: 20px; 
            background-color: #ffffff; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            margin-right: 20px;
        }
        #chat-panel { 
            width: 65%; 
            padding: 20px; 
            background-color: #ffffff; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }
        #chat-window { 
            height: 400px; 
            border: 1px solid #e0e0e0; 
            overflow-y: scroll; 
            padding: 15px; 
            margin-bottom: 15px; 
            background-color: #fafafa; 
            border-radius: 8px;
        }
        .message { 
            margin-bottom: 15px; 
            padding: 10px 15px; 
            border-radius: 15px;
            max-width: 85%;
        }
        .user { 
            text-align: right; 
            background-color: #bbdefb; /* 淺藍色 */
            color: #0d47a1; 
            margin-left: auto;
        }
        .assistant { 
            text-align: left; 
            background-color: #fce4ec; /* 淺粉色 */
            color: #ad1457; 
            margin-right: auto;
        }
        textarea, select, input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            resize: vertical; 
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 1em;
        }
        button { 
            padding: 10px 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            color: white; 
            margin-top: 5px;
            margin-right: 10px;
            transition: background-color 0.3s, opacity 0.3s;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #prompt-load-btn { background-color: #00bcd4; } /* 青色 */
        #prompt-load-btn:hover:not(:disabled) { background-color: #0097a7; }
        #prompt-save-btn { background-color: #2196F3; } /* 藍色 */
        #prompt-save-btn:hover:not(:disabled) { background-color: #1e87e5; }
        .chat-btn-group button:last-child { background-color: #f44336; }
        .chat-btn-group button:last-child:hover:not(:disabled) { background-color: #d32f2f; }

        .persona-label, .prompt-desc {
            font-weight: bold;
            margin-top: 15px;
            display: block;
            color: #333;
        }
        .prompt-desc {
            font-size: 0.9em;
            font-weight: normal;
            margin-top: 5px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
            border-left: 3px solid #ccc;
        }
        #prompt-status {
            font-size: 0.9em;
        }

        /* 新增：Log 管理面板樣式 */
        .log-control-panel {
            margin-top: 15px;
            padding: 15px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .log-control-panel input {
            width: 150px;
            margin-bottom: 0;
        }
        #download-btn {
            background-color: #10b981; /* 綠色 */
            margin-top: 0;
        }
        #download-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div id="prompt-panel">
        <h2>💊 提示詞管理 (A 網站專用)</h2>
        
        <label for="persona-id-select" class="persona-label">👤 選擇 AI 人物 (KV Key):</label>
        <select id="persona-id-select" onchange="updateNotesAndTitle(this.value); resetChat();">
            <option value="doctor_ebara" selected>doctor_ebara</option>
            <option value="system_prompt_history_person">system_prompt_history_person</option>
        </select>
        
        <p class="prompt-desc" id="persona-notes">doctor_ebara是江原（陳纂地）醫生。</p>
        <p><a href="AImodel.html">AI模型表</a></p>
        
        <label for="model-input" class="persona-label" style="margin-top: 10px;">🤖 AI 服務模型名稱:</label>
        <input type="text" id="model-input" value="@cf/google/gemma-3-12b-it" 
               placeholder="請輸入 Workers AI 模型名稱，例如 @cf/meta/llama-3-8b-instruct">

        <label for="prompt-input" class="persona-label" style="margin-top: 10px;">📜 系統提示詞內容:</label>
        <textarea id="prompt-input" rows="15" placeholder="請先點擊「讀取目前提示詞」按鈕載入內容。此處顯示的是當前人物在 KV 中的提示詞。"></textarea>

        <button id="prompt-load-btn" onclick="loadPrompt()">🔄 讀取目前提示詞</button>
        <button id="prompt-save-btn" onclick="savePrompt()" disabled>💾 保存/更新提示詞</button>
        
        <p id="prompt-status" style="color: red; margin-top: 10px; font-weight: bold;">請先選擇人物並載入提示詞。</p>
        
        <p style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; font-size: 0.9em; color: #666;">
            注意：保存成功後，對話歷史會自動重置，以便使用新的提示詞進行測試。
        </p>
    </div>

    <div id="chat-panel">
        <h2 id="chat-title">💬 與 AI 人物 對話</h2>
        <div id="chat-window"></div>
        <textarea id="user-input" rows="3" placeholder="在此輸入您的問題..." onkeydown="if(event.key === 'Enter' && !event.shiftKey) { sendMessage(); event.preventDefault(); }"></textarea>
        
        <div class="chat-btn-group">
            <button onclick="sendMessage()">發送訊息</button>
            <button onclick="resetChat()">重置對話</button>
        </div>

        <div class="log-control-panel">
            <input type="text" id="user-number-input" placeholder="受測編號 (例如 A01)">
            <button id="download-btn" onclick="downloadChatLog()">📁 下載對話 Log (CSV)</button>
        </div>

        <p id="reset-status" style="color: green; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <script>
        // 🚨 這是您的 Worker 基礎 URL，請再次確認其正確性。
        const WORKER_URL = "https://history-agent.idcllab702.workers.dev";
        let conversationHistory = []; // 用於儲存對話歷史 (包含時間戳記)

        const personaDescriptions = {
            doctor_ebara: "doctor_ebara是神靖丸的班長陳纂地醫生",
            system_prompt_history_person: "這是測試用人物，用於快速驗證 Worker 連線。"
        };

        // --- 輔助函數 ---

        function getPersonaId() {
            return document.getElementById('persona-id-select').value.trim();
        }

        function getChatEndpoint(personaId) {
            return `${WORKER_URL}/api/chat/${personaId}`;
        }

        function getAdminEndpoint(personaId) {
            return `${WORKER_URL}/api/admin/prompt/${personaId}`;
        }

        function updateNotesAndTitle(personaId) {
            document.getElementById('chat-title').textContent = `💬 與 AI 人物 ${personaId} 對話`;
            document.getElementById('persona-notes').textContent = personaDescriptions[personaId] || "無相關備註。";
        }

        function updatePromptButtonState(canSave) {
            document.getElementById('prompt-save-btn').disabled = !canSave;
            document.getElementById('prompt-load-btn').disabled = false;
        }

        function setStatusMessage(text, color) {
            const statusEl = document.getElementById('reset-status');
            statusEl.textContent = text;
            statusEl.style.color = color;
            if (text) {
                setTimeout(() => { if(statusEl.textContent === text) statusEl.textContent = ''; }, 3000);
            }
        }

        // --- 核心功能：讀取 KV 提示詞 ---

        async function loadPrompt() {
            const personaId = getPersonaId();
            const statusElement = document.getElementById('prompt-status');
            const promptInput = document.getElementById('prompt-input');
            const loadBtn = document.getElementById('prompt-load-btn');

            loadBtn.disabled = true;
            statusElement.textContent = `正在讀取人物 ${personaId} 的提示詞...`;
            statusElement.style.color = '#FFA500';

            try {
                const response = await fetch(getAdminEndpoint(personaId), {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const systemPrompt = data.prompt || data.response; 

                    if (systemPrompt) {
                        promptInput.value = systemPrompt;
                        statusElement.textContent = `✅ 提示詞讀取成功！時間: ${new Date().toLocaleTimeString('zh-TW')}`;
                        statusElement.style.color = 'green';
                        updatePromptButtonState(true);
                    } else {
                        throw new Error("Worker 返回的資料結構中缺少提示詞內容。");
                    }
                } else {
                    const errorText = await response.text();
                    throw new Error(`Worker 錯誤 (${response.status})`);
                }
            } catch (error) {
                console.error("Load Prompt Error:", error);
                statusElement.textContent = `❌ 讀取失敗: ${error.message}`;
                statusElement.style.color = 'red';
                promptInput.value = "";
                updatePromptButtonState(false);
            } finally {
                loadBtn.disabled = false;
            }
        }

        // --- 提示詞管理功能 (保存) ---

        async function savePrompt() {
            const promptInput = document.getElementById('prompt-input');
            const newPrompt = promptInput.value.trim();
            const statusElement = document.getElementById('prompt-status');
            const personaId = getPersonaId();

            if (!newPrompt) {
                statusElement.textContent = "提示詞內容不能為空！";
                return;
            }

            statusElement.textContent = "正在保存...";
            statusElement.style.color = '#FFA500'; 
            
            try {
                const response = await fetch(getAdminEndpoint(personaId), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPrompt: newPrompt })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusElement.textContent = `✅ 提示詞保存成功！時間: ${new Date().toLocaleTimeString('zh-TW')}`;
                    statusElement.style.color = 'green';
                    resetChat();
                } else {
                    statusElement.textContent = `❌ 保存失敗: ${data.details || data.message || '未知錯誤'}`;
                    statusElement.style.color = 'red';
                }
            } catch (error) {
                statusElement.textContent = `❌ 網路錯誤：無法連線到 Worker Admin 接口。`;
                statusElement.style.color = 'red';
            }
        }

        // --- 聊天功能 ---

        /** 顯示訊息到聊天窗口並將紀錄推入陣列 */
        function displayMessageAndLog(role, content) {
            const chatWindow = document.getElementById('chat-window');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            let speakerName = role === 'user' ? '您' : getPersonaId();
            msgDiv.innerHTML = `<strong>${speakerName}：</strong> ${content.replace(/\n/g, '<br>')}`;
            
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // 紀錄時間與對話，用於 CSV 下載
            conversationHistory.push({
                role: role,
                content: content,
                timestamp: new Date().toLocaleString('zh-TW')
            });
        }

        /** 發送訊息並呼叫 Worker API */
        async function sendMessage() {
            const userInput = document.getElementById('user-input');
            const modelInput = document.getElementById('model-input');
            const userContent = userInput.value.trim();
            const customModelName = modelInput.value.trim();
            
            if (!userContent) return;

            const personaId = getPersonaId();
            const chatEndpoint = getChatEndpoint(personaId);

            displayMessageAndLog('user', userContent);
            userInput.value = '';

            // 🚨 核心防呆：過濾掉 timestamp，只傳送 role 與 content 給 Cloudflare AI
            const apiMessages = conversationHistory.map(msg => ({ 
                role: msg.role, 
                content: msg.content 
            }));

            try {
                const response = await fetch(chatEndpoint, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: apiMessages })
                });

                const data = await response.json();

                if (response.ok) {
                    displayMessageAndLog('assistant', data.response);
                } else {
                    displayMessageAndLog('assistant', `[Worker 錯誤 (${response.status}): ${data.error || '未知錯誤'}]`);
                }
            } catch (error) {
                console.error("Fetch 錯誤:", error);
                displayMessageAndLog('assistant', `[網路錯誤：無法連線。]`);
            }
        }

        // --- 下載 CSV 功能 ---
        function downloadChatLog() {
            if (conversationHistory.length === 0) {
                setStatusMessage("❌ 目前沒有可下載的對話紀錄", "red");
                return;
            }

            const userNum = document.getElementById('user-number-input').value.trim() || "None";
            const now = new Date();
            
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            
            const fileName = `${yyyy}${mm}${dd}-${hh}${min}_${userNum}.csv`;

            // \ufeff 防止 Excel 開啟時產生亂碼
            let csvContent = "\ufeff時間,說話方,對話內容\n";

            conversationHistory.forEach(msg => {
                const speaker = (msg.role === 'user') ? "受測者" : getPersonaId();
                const sanitizedContent = `"${msg.content.replace(/"/g, '""')}"`;
                csvContent += `${msg.timestamp},${speaker},${sanitizedContent}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setStatusMessage(`✅ 已導出檔案: ${fileName}`, "green");
        }

        /** 清除對話歷史 */
        function resetChat() {
            conversationHistory = [];
            document.getElementById('chat-window').innerHTML = '';
            setStatusMessage("✅ 對話歷史已重置！您可以開始新對話。", "green");
        }

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            const initialId = getPersonaId();
            updateNotesAndTitle(initialId);
            document.getElementById('prompt-save-btn').disabled = true;
        });
    </script>
</body>
</html>
